<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="16" fill="#FDFBF7"/>
  <!-- Gold & Navy Architectural Skyline -->
  <!-- Left gold peak line -->
  <polygon points="32,15 32,38 28,38 28,22" fill="#C59B4E" />
  <!-- Left navy tower -->
  <polyline points="18,58 18,40 26,34 26,58" fill="none" stroke="#14263D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Center navy tower -->
  <polygon points="29,26 36,31 36,46 29,46" fill="#14263D" />
  <!-- Little house outline in gold -->
  <path d="M26,58 L33,52 L40,58" fill="none" stroke="#C59B4E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="31" y="54" width="4" height="4" fill="#C59B4E" />
  <!-- Golden Sun/Dot on i -->
  <circle cx="46" cy="35" r="4.5" fill="#C59B4E"/>
  <!-- 'ira' typography -->
  <text x="42" y="60" font-family="'Bodoni Moda', 'Playfair Display', serif" font-size="30" font-weight="bold" fill="#14263D">ira</text>
  <!-- Gold underline -->
  <line x1="18" y1="68" x2="82" y2="68" stroke="#C59B4E" stroke-width="2" stroke-linecap="round"/>
  <!-- Promoters text -->
  <text x="50" y="78" font-family="'Manrope', sans-serif" font-size="8" font-weight="700" letter-spacing="2" fill="#C59B4E" text-anchor="middle">PROMOTERS</text>
</svg>

